<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulate Input</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Simulate Input</h1>

    <div class="input__container">
      <div class="input__vertical-buttons">
        <span id="up-button" class="input__button">Up</span>
        <span id="down-button" class="input__button">Down</span>
      </div>
      <div class="input__horizontal-buttons">
        <span id="a-button" class="input__button">A</span>
        <span id="b-button" class="input__button">B</span>
      </div>
    </div>
  </body>
</html>
